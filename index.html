<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SLTMobitel Feedback Chatbot</title>
    

    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2><i data-lucide="bot" style="width:24px; height:24px; vertical-align:middle; margin-right:5px;"></i> SLTMobitel</h2>
        <p>Customer Feedback Assistant</p><br>
        <a href="pages/login.html" class="admin-login-btn">
    <i data-lucide="lock" style="width:14px; height:14px; vertical-align:middle; margin-right:5px;"></i> Admin Login
</a>
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area" id="inputArea">

        <input
            type="text"
            id="userInput"
            placeholder="Type your answer..."
        >

        <button
            class="send-button"
            onclick="sendAnswer()">
            Send
        </button>

    </div>

</div>


<script src="assets/js/config.js"></script>
<script src="assets/js/script.js"></script>

<script>
    lucide.createIcons();
</script>
</body>
</html>
