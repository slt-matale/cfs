# Render Blueprint - lets Render auto-configure this service when you
# connect the repo via "New +" -> "Blueprint" instead of setting build/start
# commands by hand. Using the dashboard's "Web Service" flow directly also
# works fine and this file can be ignored in that case.
services:
  - type: web
    name: customer-feedback-bot-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
