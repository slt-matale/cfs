<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SLTMobitel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>


<body>

<div class="login-card">

    <div class="logo">
        <img src="../assets/images/slt_logo.png" alt="SLTMobitel Logo">
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        AI Customer Feedback System
    </p>


    <div id="errorMessage"></div>


    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            id="loginBtn">

            <i data-lucide="lock" style="width:16px; height:16px; vertical-align:middle; margin-right:5px;"></i> Login

        </button>

    </form>


    <a
        href="../index.html"
        class="back">

        <i data-lucide="arrow-left" style="width:16px; height:16px; vertical-align:middle; margin-right:5px;"></i> Back to Customer Feedback

    </a>

</div>


<script src="../assets/js/config.js"></script>
<script src="../assets/js/login.js"></script>

<script>
    lucide.createIcons();
</script>
</body>
</html>
