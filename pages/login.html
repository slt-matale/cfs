<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SLTMobitel</title>

    <link rel="stylesheet" href="../assets/css/login.css">
</head>


<body>

<div class="login-card">

    <div class="logo">
        SLT
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        AI Customer Feedback System
    </p>


    <div id="errorMessage"></div>


    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            id="loginBtn">

            🔐 Login

        </button>

    </form>


    <a
        href="../index.html"
        class="back">

        ← Back to Customer Feedback

    </a>

</div>


<script src="../assets/js/config.js"></script>
<script src="../assets/js/login.js"></script>

</body>
</html>
